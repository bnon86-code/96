<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيج وطن | اليوم الوطني ٩٦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sadu"></div>

<header>
  <img src="img/moe.png" alt="وزارة التعليم" class="logo" onerror="this.style.visibility='hidden'">
  <div class="head-text">
    <h1>نسيج وطن</h1>
    <p>فقرة إدارة المدرسة في اليوم الوطني ٩٦</p>
    <p class="credit">مشاركة من منسوبات المتوسطة الأولى والثانية بالخبر<br>إدارةً ومعلماتٍ وطالباتٍ وأولياءَ أمور</p>
  </div>
  <img src="img/national-day.png" alt="شعار اليوم الوطني" class="logo" onerror="this.style.visibility='hidden'">
</header>

<main>
  <section class="info" id="info"></section>
  <section class="map-box">
    <div class="stage">
      <svg id="map" viewBox="-6 -30 792 720">
        <defs id="defs"></defs>
        <g id="depth"></g>
        <g id="shapes"></g>
        <g id="names"></g>
        <g id="lifted"></g>
      </svg>
    </div>
  </section>
</main>

<footer>
  <div class="btns">
    <button id="playAll">تشغيل الكل</button>
    <button id="stop" class="hide">إيقاف</button>
    <button id="again" class="light">من جديد</button>
    <button id="full" class="light">شاشة كاملة</button>
  </div>
  <small>المتوسطة الأولى والثانية بالخبر، الإدارة العامة للتعليم بالمنطقة الشرقية</small>
</footer>

<div class="sadu"></div>

<script src="data.js"></script>
<script src="sounds.js"></script>
<script src="app.js"></script>
</body>
</html>
