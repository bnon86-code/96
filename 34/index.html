<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السعودية خط أحمر — المادة 34</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04161c;--panel:#ffffff;--tq:#2ec4c4;--tq2:#1f7a3d;--red:#e0262f;--red2:#ff4b53;--green:#0e7a43;--green2:#16a35a;--txt:#14361d;--mut:#557060}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#ffffff 0,#f6f8f6 60%,#eaf0eb 100%);color:var(--txt);font-family:Tajawal,Tahoma,sans-serif}
.app{height:100vh;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;gap:0 2vw;padding:2.2vh 2.2vw 0}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:1.4vw;text-align:center}
.art{background:var(--red);color:#fff;font-weight:900;font-size:clamp(18px,2.3vw,40px);padding:.2em .8em;border-radius:.4em;box-shadow:0 0 30px #e0262f66}
.title{font-weight:900;font-size:clamp(20px,2.6vw,46px);line-height:1.2}
.title small{display:block;font-size:.5em;font-weight:700;color:var(--tq2);margin-top:.2em}
main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.big{margin-top:1.4vh;font-weight:900;font-size:clamp(26px,3.4vw,64px);line-height:1.1;color:#0f4a22}
.big span{color:var(--red)}
.stage{--bh:clamp(54px,10vh,104px);position:relative;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:.5vh 0 0}
.band{position:absolute;inset-inline:0;top:50%;height:var(--bh);transform:translateY(-50%);background:#14361d0d;box-shadow:inset 0 0 0 1px #14361d1f;border-radius:4px;transition:.8s}
.side{position:relative;z-index:1;height:var(--bh);display:grid;grid-template-rows:repeat(3,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;min-width:0}
.side.l{direction:ltr}
.brick{direction:rtl;background:linear-gradient(#ee4141,#c3141d 55%,#900b12);color:#fff;font-weight:700;font-size:clamp(10px,.88vw,17px);display:flex;align-items:center;justify-content:center;border-radius:2px;white-space:nowrap;overflow:hidden;padding:0 4px;box-shadow:inset 0 1px 0 #ff9b9b80,0 2px 4px #0005;min-width:0}
.brick span{overflow:hidden;text-overflow:ellipsis}
.brick.empty{background:transparent;box-shadow:inset 0 0 0 1px #14361d14}
.brick.new{animation:brickin 1.1s ease}
@keyframes brickin{0%{transform:scale(1.8);filter:brightness(2)}100%{transform:scale(1);filter:none}}
.stage.full .band{background:linear-gradient(#ee4141,#c3141d 55%,#900b12);box-shadow:0 0 40px #ff2a33aa}
.mapw{position:relative;z-index:2;margin-inline:-3vw}
.mapw svg{height:min(47vh,36vw);width:auto;display:block;filter:drop-shadow(0 10px 14px #14361d55)}
.land{fill:url(#g);stroke:#fff;stroke-width:6;stroke-linejoin:round;paint-order:stroke}
.hash{width:100%;max-width:1000px;height:clamp(44px,7.5vh,96px);margin-top:0}
.hash text{font-weight:900;font-size:78px}
.hcount{font-size:clamp(14px,1.3vw,22px);color:var(--mut);margin-top:.3vh}
.hcount b{color:var(--txt)}
aside{display:flex;flex-direction:row;gap:1.5vw;justify-content:center;align-items:stretch;min-height:0;margin-top:1vh}
.box{background:var(--panel);border:1px solid #dbe5de;box-shadow:0 6px 20px #14361d14;border-radius:18px;padding:1.4vh 1.4vw;text-align:center}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin-bottom:1vh}
#qr img,#qr canvas{display:block;width:min(10vw,13vh)!important;height:auto!important}
.box.qrb{display:flex;align-items:center;gap:1.2vw;text-align:right}.box.qrb #qr{margin:0;padding:6px}
.box.st{min-width:min(34vw,520px)}
.box h3{font-size:clamp(16px,1.5vw,26px);font-weight:900}
.box p{color:var(--mut);font-size:clamp(12px,1vw,17px);margin-top:.4vh}
.stat{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:.8vh 0}
.stat span{font-size:clamp(13px,1.1vw,19px);color:var(--mut)}
.stat b{font-size:clamp(20px,2vw,36px);font-weight:900}
.bar{height:10px;border-radius:9px;background:#14361d14;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:9px;transition:width 1s;margin-right:0}
.bar.s i{background:linear-gradient(90deg,#1f9d55,#0f6a33)}
footer{grid-column:1/-1;height:6.5vh;margin:1.2vh -2.2vw 0;background:#0f4a22;color:#fff;border-top:2px solid var(--red);overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.track{display:inline-flex;gap:2.2vw;padding-inline:2vw;font-size:clamp(15px,1.6vw,28px);font-weight:700;animation:tick 60s linear infinite}
.track span::before{content:"✦ ";color:var(--red)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
.toast{position:fixed;top:14vh;left:50%;transform:translate(-50%,-30px) scale(.9);opacity:0;background:linear-gradient(135deg,#1d5a2a,#0f2f17);border:2px solid var(--tq);border-radius:20px;padding:1.4vh 2.4vw;text-align:center;transition:.45s;z-index:20;box-shadow:0 20px 60px #000a}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.t{border-color:var(--red)}
.toast{color:#fff}.toast .n{font-size:clamp(24px,3vw,54px);font-weight:900}
.toast .r{font-size:clamp(13px,1.2vw,20px);color:var(--tq2)}
.toast.t .r{color:#ff9a9f}
/* الختام */
#fin{position:fixed;inset:0;z-index:50;background:#020b0e;color:#fff;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#fin.on{display:flex}
#cloud{position:absolute;inset:0;transition:opacity 1.5s}
#cloud span{position:absolute;font-weight:700;opacity:0;animation:fade 1.2s forwards;white-space:nowrap}
@keyframes fade{0%{opacity:0;transform:scale(1.8)}25%{opacity:.9}100%{opacity:.28;transform:scale(1)}}
#flash{position:relative;font-weight:900;font-size:clamp(40px,8vw,150px);text-align:center;text-shadow:0 0 40px #000}
#flash.t{color:var(--red2)}
#hero{position:relative;text-align:center;display:none;padding:0 4vw}
#hero.on{display:block;animation:rise 1.4s ease}
@keyframes rise{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#hero .k{font-size:clamp(20px,2.4vw,42px);color:#cdeed5;font-weight:700}
#hero .s{font-size:clamp(28px,4vw,72px);font-weight:900;margin:1.5vh 0}
#hero .b{font-size:clamp(70px,13vw,240px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 50px var(--red),0 0 100px #e0262f88}
#hero .h{font-size:clamp(22px,2.8vw,50px);font-weight:900;color:var(--red2);margin-top:2vh}
#hero .c{font-size:clamp(15px,1.4vw,24px);color:#c4dccb;margin-top:1.5vh}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sndb{border:1px solid #dbe5de!important;position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(2.2vh + env(safe-area-inset-top,0px));z-index:30;font:inherit;font-weight:700;font-size:clamp(13px,1vw,17px);padding:.5em 1em;border:0;border-radius:99px;background:#fff;color:#173d1f;cursor:pointer;box-shadow:0 6px 20px #0006}
.sndb.on{background:#0f4a22;color:#fff}
.entry{display:flex;flex-direction:column;gap:1vh;min-width:min(52vw,760px);text-align:right}
.erow{display:grid;grid-template-columns:auto 1fr auto auto;gap:.6vw;align-items:center}
.erow.t{grid-template-columns:auto 1fr auto}
.erow label{font-weight:900;font-size:clamp(14px,1.2vw,21px);min-width:6.5em}
.erow.t label{color:var(--red)}
.entry input,.entry select{font:inherit;font-size:clamp(14px,1.2vw,21px);padding:.45em .7em;border:1px solid #c9d8ce;border-radius:10px;background:#fff;color:var(--txt);min-width:0}
.entry input:focus,.entry select:focus,.entry button:focus-visible{outline:3px solid #1f9d5555;border-color:#1f9d55}
.entry button{font:inherit;font-weight:900;font-size:clamp(14px,1.2vw,21px);padding:.45em 1.1em;border:0;border-radius:10px;background:#0f4a22;color:#fff;cursor:pointer}
.erow.t button{background:var(--red)}
.emsg{min-height:1.4em;font-size:clamp(12px,1vw,17px);color:var(--mut)}
</style>
</head>

<script>
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo');
const $ = id => document.getElementById(id);
const ar = n => Number(n).toLocaleString('ar-SA');
let T = 25, S = 200, school = 'منسوبات المتوسطة الأولى والثانية بالخبر';
let teachers = [], students = [], seen = null, finaleSeen = null, playing = false, autoPlayed = false, lineDone = false;

function drawTeachers(newIds) {
  const slots = Math.max(T, teachers.length);
  const per = Math.ceil(slots / 2), cols = Math.max(1, Math.ceil(per / 3));
  const bufs = [[], []];
  for (let i = 0; i < cols * 3 * 2; i++) {
    const t = teachers[i];
    bufs[i % 2].push(t ? `<div class="brick${newIds.has(t.id) ? ' new' : ''}"><span>${esc(t.n)}</span></div>` : '<div class="brick empty"></div>');
  }
  [$('sideR'), $('sideL')].forEach((el, k) => { el.style.gridTemplateColumns = `repeat(${cols},1fr)`; el.innerHTML = bufs[k].join(''); });
  const full = teachers.length >= T;
  $('stage').classList.toggle('full', full);
  if (full && !lineDone && seen) playSound();
  lineDone = full;
}

function render(newIds) {
  drawTeachers(newIds);
  const sp = Math.min(1, students.length / S);
  $('hs1').setAttribute('offset', sp); $('hs2').setAttribute('offset', sp);
  $('sc').textContent = ar(students.length); $('st').textContent = ar(S);
  $('tc').textContent = ar(teachers.length) + ' / ' + ar(T);
  $('sc2').textContent = ar(students.length) + ' / ' + ar(S);
  $('tb').style.width = Math.min(100, teachers.length / T * 100) + '%';
  $('sb').style.width = sp * 100 + '%';
  const last = students.slice(-60).reverse();
  if (last.length) {
    const items = last.map(s => `<span>${esc(s.n)}</span>`).join('');
    $('track').innerHTML = items + items;
    $('track').style.animationDuration = Math.max(25, last.length * 2.2) + 's';
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// إشعار الأسماء الجديدة
const queue = []; let toasting = false;
function toastNext() {
  if (toasting || !queue.length || playing) return;
  toasting = true;
  const x = queue.shift();
  $('tn').textContent = x.n;
  $('tr').textContent = x.t ? 'انضمت إلى الخط الأحمر 🇸🇦' : 'أضافت اسمها للهاشتاق 🇸🇦';
  $('toast').className = 'toast on' + (x.t ? ' t' : '');
  setTimeout(() => { $('toast').className = 'toast' + (x.t ? ' t' : ''); setTimeout(() => { toasting = false; toastNext(); }, 450); }, queue.length > 5 ? 900 : 2200);
}

function apply(d) {
  T = d.target.t; S = d.target.s; school = d.school || school;
  const ids = new Set([...d.teachers, ...d.students].map(x => x.id));
  const newIds = new Set();
  if (seen) {
    d.teachers.forEach(x => { if (!seen.has(x.id)) { newIds.add(x.id); queue.push({ n: x.n, t: 1 }); } });
    d.students.forEach(x => { if (!seen.has(x.id)) { newIds.add(x.id); queue.push({ n: x.n, t: 0 }); } });
    if (queue.length > 12) queue.splice(0, queue.length - 12);
  }
  seen = ids; teachers = d.teachers; students = d.students;
  render(newIds); toastNext();
  // الختام: عند الاكتمال لأول مرة، أو عند تشغيله من لوحة الإدارة
  const complete = teachers.length >= T && students.length >= S;
  let played = null; try { played = localStorage.getItem('ka34_fin'); } catch (e) {}
  if (finaleSeen === null) { finaleSeen = d.finale; }
  else if (d.finale && d.finale !== finaleSeen) { finaleSeen = d.finale; finale(); return; }
  if (complete && !autoPlayed && (DEMO || played !== 'done')) { autoPlayed = true; if (!DEMO) try { localStorage.setItem('ka34_fin', 'done'); } catch (e) {} setTimeout(finale, 3500); }
}

async function poll() {
  try {
    const r = await fetch('api.php?action=list&_=' + Date.now());
    apply(await r.json());
  } catch (e) {}
  setTimeout(poll, 3000);
}

// ===== الصوت: يشتغل عند اكتمال الخط الأحمر ومع مونتاج الختام =====
let soundOn = false;
const snd = $('snd');
const song = $('song');
function playSong() { if (!soundOn) return; try { snd.pause(); song.currentTime = 0; song.play().catch(() => {}); } catch (e) {} }
function playSound() { if (!soundOn) return; try { snd.currentTime = 0; snd.play().catch(() => {}); } catch (e) {} }
$('sndBtn').onclick = () => {
  soundOn = !soundOn;
  $('sndBtn').textContent = soundOn ? '🔊 الصوت مفعّل' : '🔇 تفعيل الصوت';
  $('sndBtn').classList.toggle('on', soundOn);
  if (soundOn) snd.play().then(() => { snd.pause(); snd.currentTime = 0; }).catch(() => {}); else snd.pause();
};

// ===== مونتاج الختام =====
function finale() {
  if (playing) return; playing = true;
  const fin = $('fin'), cloud = $('cloud'), flash = $('flash'), hero = $('hero');
  cloud.innerHTML = ''; cloud.style.opacity = '1'; hero.className = '';
  playSong(); flash.style.display = 'block';
  fin.classList.add('on');
  const all = [...teachers.map(x => ({ n: x.n, t: 1 })), ...students.map(x => ({ n: x.n, t: 0 }))];
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  // المنسوبات أولًا ثم الطالبات
  all.sort((a, b) => b.t - a.t);
  const dur = 11000, step = Math.max(22, Math.min(320, dur / Math.max(1, all.length)));
  let i = 0;
  const tick = () => {
    if (i >= all.length) return heroShow();
    const x = all[i++];
    flash.textContent = x.n; flash.className = x.t ? 't' : '';
    if (i % Math.max(1, Math.round(all.length / 220)) === 0 || all.length < 220) {
      const s = document.createElement('span');
      s.textContent = x.n;
      s.style.left = Math.random() * 92 + '%'; s.style.top = Math.random() * 94 + '%';
      s.style.fontSize = (12 + Math.random() * 16) + 'px';
      s.style.color = x.t ? '#ff4b53' : (Math.random() < .5 ? '#7fe3e0' : '#1bb064');
      cloud.appendChild(s);
    }
    setTimeout(tick, step);
  };
  setTimeout(tick, 600);
  function heroShow() {
    flash.style.display = 'none';
    $('school').textContent = school;
    $('fc').textContent = ar(teachers.length) + ' منسوبة و ' + ar(students.length) + ' طالبة رسمن الخط الأحمر معًا';
    hero.className = 'on'; cloud.style.opacity = '.35';
    confetti();
    setTimeout(closeFin, 45000);
  }
}
function confetti() {
  const cols = ['#1bb064', '#ffffff', '#e0262f', '#2ec4c4'];
  for (let i = 0; i < 160; i++) {
    const c = document.createElement('i'); c.className = 'cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (3 + Math.random() * 4) + 's';
    c.style.animationDelay = (Math.random() * 3) + 's';
    $('fin').appendChild(c);
    setTimeout(() => c.remove(), 11000);
  }
}
function closeFin() { try { snd.pause(); song.pause(); } catch (e) {} $('fin').classList.remove('on'); playing = false; toastNext(); }
$('fin').onclick = closeFin;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFin(); });
document.addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); });

// ===== وضع التجربة: index.html?demo =====
if (DEMO) {
  const fn = ['نورة', 'سارة', 'ريم', 'لمى', 'جود', 'رهف', 'شهد', 'غلا', 'دانة', 'لين', 'ميار', 'حلا', 'جنى', 'رزان', 'وعد', 'هيا', 'العنود', 'مها', 'أروى', 'تالا'];
  const ln = ['العتيبي', 'القحطاني', 'الشمري', 'الدوسري', 'الغامدي', 'الزهراني', 'عسيري', 'الحربي', 'المطيري', 'السبيعي'];
  const d = { teachers: [], students: [], finale: 0, target: { t: 25, s: 200 }, school };
  let id = 0;
  const add = () => {
    for (let k = 0; k < 6; k++) {
      const n = fn[Math.random() * fn.length | 0] + ' ' + ln[Math.random() * ln.length | 0];
      if (d.teachers.length < 25 && Math.random() < .2) d.teachers.push({ id: ++id, n: 'أ. ' + n });
      else if (d.students.length < 200) d.students.push({ id: ++id, n });
    }
    if (d.teachers.length < 25 && d.students.length >= 200) d.teachers.push({ id: ++id, n: 'أ. ' + fn[id % 20] });
    apply(JSON.parse(JSON.stringify(d)));
    if (d.teachers.length < 25 || d.students.length < 200) setTimeout(add, 1500);
  };
  const init = +(qs.get('demo') || 0);
  if (init) { while (d.students.length < init * 5) { d.students.push({ id: ++id, n: fn[id % 20] + ' ' + ln[id % 10] }); if (d.teachers.length < init / 4) d.teachers.push({ id: ++id, n: 'أ. ' + fn[id % 20] + ' ' + ln[id % 10] }); } }
  apply(JSON.parse(JSON.stringify(d)));
  setTimeout(add, 1500);
} else {
  // ===== النسخة المحلية: الأسماء تُحفظ في متصفح جهاز الشاشة =====
  const KEY = 'ka34_names';
  let store = { teachers: [], students: [], seq: 0 };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.teachers) store = s; } catch (e) {}
  if (qs.has('reset')) { store = { teachers: [], students: [], seq: 0 }; try { localStorage.removeItem(KEY); localStorage.removeItem('ka34_fin'); } catch (e) {} }
  const norm = s => s.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, '');
  const pack = () => ({ teachers: store.teachers, students: store.students, finale: 0, target: { t: T, s: S }, school });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  function add(role) {
    const inp = $(role === 't' ? 'tName' : 'sName');
    const n = inp.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    if (n.length < 2) { $('emsg').textContent = 'اكتبي الاسم أولًا'; inp.focus(); return; }
    const list = role === 't' ? store.teachers : store.students;
    const c = role === 't' ? '' : $('sCls').value;
    if (list.some(x => norm(x.n) === norm(n) && (x.c || '') === c)) { $('emsg').textContent = 'الاسم موجود على اللوحة'; return; }
    list.push({ id: ++store.seq, n, c });
    save(); apply(pack());
    inp.value = ''; $('emsg').textContent = 'تمت إضافة ' + n + ' 🇸🇦';
  }
  $('sGo').onclick = () => add('s'); $('tGo').onclick = () => add('t');
  $('sName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add('s'); } });
  $('tName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add('t'); } });
  $('entry').addEventListener('submit', e => e.preventDefault());
  apply(pack());
}
</script>
